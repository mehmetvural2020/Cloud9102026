<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud9102026 · Task Manager</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="app__brand">
          <span class="app__logo">C9</span>
          <div>
            <h1>Cloud9102026</h1>
            <p class="app__subtitle">Task manager · Cloud Agent demo</p>
          </div>
        </div>
        <span id="status-pill" class="pill pill--pending">connecting…</span>
      </header>

      <form id="task-form" class="task-form" autocomplete="off">
        <input
          id="task-input"
          class="task-form__input"
          type="text"
          name="title"
          placeholder="Add a new task and press Enter…"
          aria-label="New task title"
          required
        />
        <button class="task-form__button" type="submit">Add</button>
      </form>

      <section class="tasks">
        <div class="tasks__meta">
          <h2>Your tasks</h2>
          <span id="task-count" class="tasks__count">0</span>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <p id="empty-state" class="tasks__empty">No tasks yet. Add your first one above.</p>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
